id: grievance introduction
question: |
  Ask your housing authority to fix a problem
subquestion: |
  Your housing authority is the public agency that rents your home to you.
  A grievance is a complaint about something it did or did not do.
  This tool makes a letter to ask the housing authority to fix a problem.

  A hearing is a chance to explain the problem to someone who can decide it.
  An informal meeting is a meeting with staff to try to solve the problem
  without a hearing. You can:

  * Start a grievance and ask for a meeting and hearing, or
  * Ask for a hearing after an informal meeting did not solve the problem.

  You will review your letter, then print and sign it. Nothing is sent for you.

  **Need repairs?** [UpToCode](https://uptocode.org/) is a free tool for repair
  problems. It helps you keep track of problems and ask your landlord, housing
  inspector, or court for help. It is another way to get help. You do not need to file a grievance first.

  **Have eviction court papers?** Use [MADE](https://www.gbls.org/MADE) for
  help filling out your court papers. This grievance letter does not replace it.
continue button field: grievance_intro
---
id: grievance scope
question: |
  Are you a current tenant in Massachusetts public housing?
subquestion: |
  In public housing, you rent from a housing authority.
  Answer no if you rent from a private landlord with a Section 8 voucher.
  Also answer no if you are applying for housing.
fields:
  - no label: eligible_tenant
    datatype: yesnoradio
---
id: outside grievance scope
event: outside_scope
question: |
  This tool covers a different type of housing
subquestion: |
  It makes letters for people who live in Massachusetts public housing now.
  The problem must affect you or someone who lives with you.
  Other housing programs work differently.

  Read your notice for the deadline and how to challenge the decision.
  [Find housing help](https://www.masslegalhelp.org/housing-apartments-shelter/public-subsidized-housing).

  ${ action_button_html(url_action("grievance_change_housing"), label="Change my housing answer", color="info") }
buttons:
  - Start over: restart
---
id: housing program
question: |
  Does your public housing get state or federal funds?
subquestion: |
  Your lease or housing authority can tell you. You can continue if you do not know.
fields:
  - Housing program: housing_program
    input type: radio
    choices:
      - State public housing: state
      - Federal public housing: federal
      - I do not know: unknown
---
id: grievance stage
question: |
  What do you need to do now?
fields:
  - no label: grievance_stage
    input type: radio
    choices:
      - Start a grievance: initial
      - Request a hearing after an informal meeting: hearing
      - Challenge a hearing or appeal decision: appeal
---
id: grievance appeal guidance
event: appeal_guidance
question: |
  Use the appeal instructions for your decision
subquestion: |
  This tool does not make an appeal letter. An appeal asks someone to review
  a decision you disagree with. It has different deadlines and may go to a
  different person or agency.

  In state public housing, you can often ask the board to review the decision.
  The board is a group that leads the housing authority. You usually have 14 days from when the
  decision is mailed or given to you. Some rules differ, including for some
  decisions to end a lease. Boston Housing Authority uses a staff leader
  instead of a board. This person is called the administrator.

  Federal public housing follows different rules. Do not send a federal
  housing appeal on a state housing form. Do not send it to EOHLC,
  the state housing agency.

  [Read how to ask for review of a grievance decision](https://www.masslegalhelp.org/housing-apartments-shelter/public-subsidized-housing/getting-grievance-decision).
  [Find the sample appeal letters](https://www.masslegalhelp.org/housing-apartments-shelter/public-subsidized-housing/sample-letters-forms-and-worksheets).
  Get legal help right away if a deadline is near.

  If you also have an eviction court case, [MADE](https://www.gbls.org/MADE)
  can help you fill out your court papers. It does not appeal a grievance decision.
  Do not wait for the grievance appeal before meeting court deadlines.

  ${ action_button_html(url_action("grievance_change_stage"), label="Change my request", color="info") }
buttons:
  - Start over: restart
---
id: eviction issue
question: |
  Is the housing authority trying to make you move out?
fields:
  - no label: eviction_issue
    datatype: yesnoradio
---
id: grievance eviction guidance
question: |
  Check your notice and get help right away
subquestion: |
  You may not have a right to a grievance hearing for some eviction reasons. The rules
  depend on your housing program, lease, grievance policy, and the reason
  for eviction. This tool does not decide whether you have a right to a hearing.

  You can still use it to ask for a hearing. Read
  [which problems can have a grievance hearing](https://www.masslegalhelp.org/housing-apartments-shelter/public-subsidized-housing/types-grievances)
  and get legal help right away.

  This letter does not answer an eviction court case. If you have eviction
  court papers, use [MADE](https://www.gbls.org/MADE) to help fill out your
  court forms. Do not miss a court date or deadline while waiting for
  the housing authority.
continue button field: eviction_guidance
---
id: grievance deadlines
question: |
  Check the deadline before you send your letter
subquestion: |
  Look at your notice, lease, and housing authority's grievance policy.
  Ask for help right away. This tool will not work out the deadline for you.

  % if housing_program == "state" and grievance_stage == "initial":
  First check your lease and grievance policy for a deadline.
  If they do not give one, state rules usually allow:

  * 7 days after a notice to end your lease;
  * 14 days for a rent notice; or
  * 14 days for another problem, from when you knew or should have known about it.
  % elif housing_program == "state":
  In state public housing, a hearing usually comes next if the meeting with
  staff does not solve the problem. You have already filed your grievance. Check any notice
  and your grievance policy for further steps or deadlines.
  % elif housing_program == "federal":
  Federal rules do not set one deadline for every grievance. Check your
  notice and policy. After an informal meeting, follow the written summary's
  instructions to ask for a hearing.
  % else:
  Ask the housing authority which rules apply. Some deadlines can be as
  short as 7 days. Do not wait to act while finding out.
  % endif

  If your letter may be late, explain why. Ask for more time.
  The housing authority may say no.
  [Read more about filing a grievance](https://www.masslegalhelp.org/housing-apartments-shelter/public-subsidized-housing/filing-grievance).
continue button field: grievance_deadlines
---
id: housing authority recipient
question: |
  Which housing authority will you send your letter to?
subquestion: |
  Use the office listed in your notice or grievance policy.
fields:
  - Housing authority name: housing_authority_name
  - Mailing address: housing_authority_address
    input type: area
---
id: complaint facts
question: |
  What happened?
subquestion: |
  Describe the problem in your own words. Include dates and any notice you
  received. Explain what the housing authority did or did not do.
  Say how it affected you or someone who lives with you.

  % if grievance_stage == "hearing":
  Give the date of your informal meeting and say why it did not solve the problem.
  % endif

  If you may be late, explain why and ask for more time. You do not need
  to share private facts that do not help explain the problem.
fields:
  - What you want the housing authority to know: complaint_facts
    input type: area
---
id: action requested
question: |
  What would fix the problem?
subquestion: |
  Say what you want the housing authority to do.
  You could ask it to fix a rent charge, make a repair, or explain a decision.
  Give details about what you want.
fields:
  - What you want the housing authority to do: action_requested
    input type: area
---
id: letter date
question: |
  What date should be on your letter?
fields:
  - Date: letter_date
    datatype: date
    default: ${ today() }
---
id: preview grievance
question: |
  Review your letter
subquestion: |
  ${ al_recipient_bundle.as_pdf(key='preview') }

  Check the names, address, facts, and what you are asking for. You will sign the printed letter.

  ${ action_button_html(url_action('review_lt3grievancecomplaint'), label='Edit answers', color='info') }
continue button field: lt3grievancecomplaint_preview_question
---
