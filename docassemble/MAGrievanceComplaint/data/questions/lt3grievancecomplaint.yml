---
id: grievance introduction
question: |
  Ask your housing authority to address a problem
subquestion: |
  A grievance is a complaint about something your housing authority did or
  failed to do. This tool makes one letter for your current stage:

  * Start a grievance and ask for a meeting and hearing, or
  * Ask for a hearing after an informal meeting did not solve the problem.

  You will review your letter, then print and sign it. Nothing is sent for you.
continue button field: grievance_intro
---
id: grievance scope
question: |
  Are you a current tenant in Massachusetts public housing?
subquestion: |
  Public housing is housing rented to you by a housing authority.
  Answer no if you rent from a private landlord with a Section 8 voucher,
  or if you are applying for housing.
fields:
  - no label: eligible_tenant
    datatype: yesnoradio
---
id: outside grievance scope
event: outside_scope
question: |
  This tool covers a different type of housing
subquestion: |
  It prepares letters for current Massachusetts public housing tenants about
  their own household. Other housing programs have different procedures.

  Read your notice for the deadline and how to challenge the decision.
  [Find housing help](https://www.masslegalhelp.org/housing-apartments-shelter/public-subsidized-housing).

  ${ action_button_html(url_action("grievance_change_housing"), label="Change my housing answer", color="info") }
buttons:
  - Start over: restart
---
id: housing program
question: |
  Is your public housing state or federally funded?
subquestion: |
  Your lease or housing authority can tell you. You can continue if you do not know.
fields:
  - Housing program: housing_program
    input type: radio
    choices:
      - State public housing: state
      - Federal public housing: federal
      - I do not know: unknown
---
id: grievance stage
question: |
  What do you need to do now?
fields:
  - no label: grievance_stage
    input type: radio
    choices:
      - Start a grievance: initial
      - Request a hearing after an informal meeting: hearing
      - Challenge a hearing or appeal decision: appeal
---
id: grievance appeal guidance
event: appeal_guidance
question: |
  Use the appeal instructions for your decision
subquestion: |
  This tool does not prepare an appeal. An appeal has different deadlines
  and may go to a different person or agency.

  In state public housing, the usual deadline to request review by the
  housing authority board is 14 days after the hearing decision is mailed
  or delivered. Exceptions apply, including some lease termination decisions.
  Boston Housing Authority uses an administrator instead of a board.

  Federal public housing follows different rules. Do not send a federal
  housing appeal to EOHLC using a state-housing appeal form.

  [Read about challenging a grievance decision](https://www.masslegalhelp.org/housing-apartments-shelter/public-subsidized-housing/getting-grievance-decision).
  [Find the sample appeal letters](https://www.masslegalhelp.org/housing-apartments-shelter/public-subsidized-housing/sample-letters-forms-and-worksheets).
  Get legal help promptly if a deadline is near.

  ${ action_button_html(url_action("grievance_change_stage"), label="Change my request", color="info") }
buttons:
  - Start over: restart
---
id: eviction issue
question: |
  Is the housing authority trying to end your tenancy?
fields:
  - no label: eviction_issue
    datatype: yesnoradio
---
id: grievance eviction guidance
question: |
  Check your notice and get help promptly
subquestion: |
  Some eviction disputes do not qualify for a grievance hearing. The rules
  depend on your housing program, lease, grievance policy, and the reason
  for eviction. This tool does not decide whether you have a right to a hearing.

  You can still use it to ask for a hearing. Read
  [which disputes can be grieved](https://www.masslegalhelp.org/housing-apartments-shelter/public-subsidized-housing/types-grievances)
  and seek legal help promptly.

  This letter does not answer an eviction court case. Do not miss a court
  date or deadline while waiting for the housing authority.
continue button field: eviction_guidance
---
id: grievance deadlines
question: |
  Check the deadline before you send your letter
subquestion: |
  Look at your notice, lease, and housing authority's grievance policy.
  Send your request promptly. Do not wait for this tool to calculate a deadline.

  % if housing_program == "state" and grievance_stage == "initial":
  If your lease and grievance policy do not give a deadline, state rules
  generally allow 7 days after a lease termination notice, or 14 days for
  a rent notice or another problem. For another problem, time runs from
  when you knew or should have known about it.
  % elif housing_program == "state":
  In state public housing, a hearing generally follows an unresolved informal
  meeting. This is a follow-up to your existing grievance. Check any notice
  and your grievance policy for further steps or deadlines.
  % elif housing_program == "federal":
  Federal rules do not set one deadline for every grievance. Check your
  notice and policy. After an informal meeting, follow the written summary's
  instructions to request a hearing.
  % else:
  Ask the housing authority which rules apply. Some deadlines can be as
  short as 7 days. Do not wait to act while finding out.
  % endif

  If your request may be late, explain why in your letter and ask for more time.
  The housing authority may not grant it.
  [Read more about filing a grievance](https://www.masslegalhelp.org/housing-apartments-shelter/public-subsidized-housing/filing-grievance).
continue button field: grievance_deadlines
---
id: housing authority recipient
question: |
  Which housing authority will receive your letter?
subquestion: |
  Use the office listed in your notice or grievance policy.
fields:
  - Housing authority name: housing_authority_name
  - Mailing address: housing_authority_address
    input type: area
---
id: complaint facts
question: |
  What happened?
subquestion: |
  Describe the problem in your own words. Include dates and any notice you
  received. Explain what the housing authority did or did not do and how
  it affected your household.

  % if grievance_stage == "hearing":
  Include when your informal meeting happened and why the problem is still unresolved.
  % endif

  If you may be late, explain why and ask for more time. You do not need
  to share unrelated private details.
fields:
  - What you want the housing authority to know: complaint_facts
    input type: area
---
id: action requested
question: |
  What would fix the problem?
subquestion: |
  For example, ask the housing authority to correct a rent charge, make a
  repair, or explain a decision. Be specific about what you want.
fields:
  - What you want the housing authority to do: action_requested
    input type: area
---
id: letter date
question: |
  What date should be on your letter?
fields:
  - Date: letter_date
    datatype: date
    default: ${ today() }
---
id: preview grievance
question: |
  Review your letter
subquestion: |
  ${ al_recipient_bundle.as_pdf(key='preview') }

  Check the names, address, facts, and request. You will sign the printed letter.

  ${ action_button_html(url_action('review_lt3grievancecomplaint'), label='Edit answers', color='info') }
continue button field: lt3grievancecomplaint_preview_question
---
id: grievance review
event: review_lt3grievancecomplaint
question: |
  Review your answers
review:
  - Edit: eligible_tenant
    button: |
      **Current Massachusetts public housing tenant:** ${ word(yesno(eligible_tenant)) }
  - Edit: housing_program
    button: |
      **Housing program:** ${ {'state': 'State public housing', 'federal': 'Federal public housing', 'unknown': 'I do not know'}[housing_program] }
  - Edit: grievance_stage
    button: |
      **Request:** ${ {'initial': 'Start a grievance', 'hearing': 'Hearing after an informal meeting', 'appeal': 'Challenge a hearing or appeal decision'}[grievance_stage] }
  - Edit: eviction_issue
    button: |
      **Housing authority is trying to end your tenancy:** ${ word(yesno(eviction_issue)) }
  - Edit: users[0].name.first
    button: |
      **Your name:** ${ users[0] }
  - Edit: users[0].address.address
    button: |
      **Your address:** ${ users[0].address.on_one_line() }
  - Edit: housing_authority_name
    button: |
      **Housing authority:** ${ housing_authority_name }
      ${ housing_authority_address }
  - Edit: complaint_facts
    button: |
      **What happened:** ${ complaint_facts }
  - Edit: action_requested
    button: |
      **What would fix the problem:** ${ action_requested }
  - Edit: letter_date
    button: |
      **Letter date:** ${ letter_date }
---
id: download lt3grievancecomplaint
event: lt3grievancecomplaint_download
question: |
  Download and send your letter
subquestion: |
  1. Download, read, print, and sign the letter.
  2. Deliver it to the housing authority before your deadline.
  3. Keep a copy and proof of delivery.

  This tool has not sent anything. The instructions explain what to do next.

  ${ action_button_html(url_action('review_lt3grievancecomplaint'), label='Edit answers', color='info') }
  ${ al_user_bundle.download_list_html() }
progress: 100
