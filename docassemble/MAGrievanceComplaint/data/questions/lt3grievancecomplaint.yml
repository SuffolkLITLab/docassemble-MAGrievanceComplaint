metadata:
  title: Massachusetts public housing grievance complaint and hearing request
  short title: Public housing grievance
  description: |
    Write a grievance complaint or request a hearing about a Massachusetts
    public housing problem. Explain what happened, ask the housing authority
    to fix it, and download a letter with next steps. For current tenants,
    including people challenging a rent charge, repair problem, or other
    housing authority decision.
  can_I_use_this_form: |
    Use this tool if you are a current tenant in Massachusetts public housing
    and want to raise your own household's problem with the housing authority.
    It can help with your first request or a hearing request after an informal
    meeting. It does not appeal a hearing decision, answer an eviction case,
    or handle housing applications or Section 8 vouchers.
  before_you_start: |
    Have your lease, the housing authority's grievance policy, and any notice
    about the problem nearby. Gather the housing authority's name and address,
    the facts, and what you want it to do. You can write in your own words.
    Check any deadline now. This tool does not send your letter.
  when_you_are_finished: |
    Download, read, print, and sign your letter. Deliver it to the housing
    authority before the deadline. Keep a copy and proof of delivery.
  maturity: testing
  estimated_completion_minutes: 15
  estimated_completion_delta: 5
  LIST_topics:
    - HO-03-02-00-00
    - CO-04-00-00-00
  tags:
    - HO-03-02-00-00
    - CO-04-00-00-00
  authors:
