metadata:
  title: Massachusetts public housing grievance complaint and hearing request
  short title: Public housing grievance
  description: |
    Make a letter about a problem in Massachusetts public housing.
    Tell the housing authority what happened. Ask it to fix the problem.
    Download your letter and learn the next steps.

    For example, you may want help with:

    * Rent or a charge you think is wrong.
    * Repairs the housing authority has not made.
    * A request to move to a new unit that staff have not acted on.
    * A decision about keeping a pet.
    * Unfair treatment or harassment by housing authority staff.
    * Staff sharing or using your household's private facts when they should not.

    A grievance is a complaint to the housing authority, the public agency
    that rents your home to you. A hearing is a chance to explain the problem
    to someone who can decide it. You can start a grievance or ask for a
    hearing after a meeting with staff did not solve the problem.
    This tool is for people who live in public housing now. The problem must
    affect you or someone who lives with you.
  can_I_use_this_form: |
    Use this tool if you rent a home in Massachusetts state or federal public
    housing. You can complain about something your housing authority did or
    did not do. The problem can affect you or someone who lives with you.
    If the problem is with another tenant, focus on the housing authority.
    Your complaint must be about what it did or did not do. This tool does not make a
    claim against that tenant.

    **Is the housing authority trying to make you move out (evict you)?**
    Some reasons for eviction may limit your right to a grievance hearing. You may still be able to raise
    a different problem, such as a rent amount you think is wrong.

    * In state public housing, one example is not paying rent.
      Your lease (rental agreement) may still give you a right to a hearing.
      Other examples are serious harm or threats, harassment, damage, or theft.
      They also include illegal weapons or explosives, some drug crimes,
      and dangerous crimes. They also include
      illegal use of the home under "nuisance" laws. These are laws about
      certain harmful or illegal uses of a home. Special rules apply to what
      a guest does and to marijuana.
    * In federal public housing, examples include threatening, violent, or
      drug-related crime. They can also include a household member's felony
      conviction (being found guilty of a serious crime). You do not always
      lose the right to a hearing for these reasons. The housing authority's
      rules and your rights under state law matter.

    Check your notice, lease, and grievance policy. Read
    [MassLegalHelp's examples and special rules](https://www.masslegalhelp.org/housing-apartments-shelter/public-subsidized-housing/types-grievances)
    for more details. Get legal help if you do not know whether you can have a hearing.

    **This tool does not** ask for review of a hearing decision (an appeal).
    It does not answer an eviction court case.
    It does not help you apply for housing or deal with vouchers.
    It cannot make a grievance for someone in another home. If you cannot use this tool, you may still have a right to a
    grievance hearing. Other housing programs may have different steps.

    For eviction court papers, use [MADE](https://www.gbls.org/MADE).
    For repair problems, [UpToCode](https://uptocode.org/) is another choice.
    You do not need to file a grievance first.
  before_you_start: |
    Have your lease (rental agreement) and any notice about the problem nearby.
    Also have the grievance policy: the housing authority's rules for complaints.
    Get the housing authority's name and address. Think about what happened
    and what you want it to do. You can write in your own words.
    Check any deadline now. This tool does not send your letter.
  when_you_are_finished: |
    Download, read, print, and sign your letter. Send it to the housing
    authority on time. Keep a copy and proof of when it arrived.
